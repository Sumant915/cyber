services:
  - type: web
    name: zta-research-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ZTA_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ZTA_DB_PATH
        value: /var/data/zta.db