services:
  backend:
    image: python:3.13-slim
    working_dir: /app/backend
    volumes:
      - ./:/app
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      ZTA_SECRET_KEY: ${ZTA_SECRET_KEY:?Set ZTA_SECRET_KEY before starting Compose}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS before starting Compose}
      ZTA_DB_PATH: /app/backend/zta.db
    ports:
      - "8000:8000"
  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    ports:
      - "5173:5173"